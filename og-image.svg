<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF1F7"/><stop offset="1" stop-color="#DFE4EE"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CC5A"/><stop offset=".55" stop-color="#F2B544"/><stop offset="1" stop-color="#D89A1B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <g transform="translate(96,120)">
    <rect width="132" height="132" rx="30" fill="#FBFAF6"/>
    <path d="M59 71 L59 35 A36 36 0 0 1 90.2 89 Z" fill="url(#gold)"/>
    <circle cx="59" cy="71" r="38" fill="none" stroke="#13213A" stroke-width="7"/>
    <line x1="59" y1="71" x2="40" y2="58" stroke="#13213A" stroke-width="6.5" stroke-linecap="round"/>
    <line x1="59" y1="71" x2="78" y2="59" stroke="#13213A" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="59" cy="71" r="5.5" fill="#13213A"/>
    <circle cx="108" cy="29" r="11" fill="#F2B544"/>
    <g stroke="#F2B544" stroke-width="3.2" stroke-linecap="round">
      <line x1="108" y1="8" x2="108" y2="14"/><line x1="108" y1="44" x2="108" y2="50"/>
      <line x1="87" y1="29" x2="93" y2="29"/><line x1="123" y1="29" x2="129" y2="29"/>
    </g>
    <text x="164" y="86" font-size="46" font-weight="800" fill="#13213A" letter-spacing="-1">Golden Window</text>
  </g>

  <text x="96" y="360" font-size="76" font-weight="800" fill="#16202E" letter-spacing="-2">The best time to be</text>
  <text x="96" y="446" font-size="76" font-weight="800" fill="#16202E" letter-spacing="-2">outside today<tspan fill="#D89A1B">.</tspan></text>

  <text x="98" y="516" font-size="30" font-weight="500" fill="#5B6472">A personal weather score, tuned to how you like it — not a generic forecast.</text>
  <text x="98" y="566" font-size="26" font-weight="700" fill="#2F6BED">thegoldenwindow.app</text>

  <g transform="translate(0,588)" stroke="#C6A24A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M0 30 C120 -6 200 -6 320 22 S520 40 640 8 S860 -12 980 18 1200 26 1200 26"/>
  </g>
</svg>
